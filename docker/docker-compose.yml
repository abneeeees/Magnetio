services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - search-service
    environment:
      - SEARCH_SERVICE_URL=http://search-service:3002

  search-service:
    build:
      context: .
      dockerfile: docker/search-service.Dockerfile
    ports:
      - "3002:3002"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - API_URL=http://api:3001
