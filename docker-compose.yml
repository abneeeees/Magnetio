services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile

    container_name: magnetio-backend

    env_file:
      - ./backend/.env

    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile

    ports:
      - "3001:3001"

    container_name: magnetio-frontend

    depends_on:
      - backend
